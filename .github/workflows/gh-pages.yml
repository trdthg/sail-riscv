name: Deploy Web Demo

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache GMP (wasm artifacts)
        uses: actions/cache@v5
        with:
          path: |
            wasm/gmp-wasm/binding/gmp/src
            wasm/gmp-wasm/binding/gmp/dist
            wasm/gmp-wasm/binding/gmp/tune
          key: gmp-${{ runner.os }}-${{ hashFiles('wasm/gmp-wasm/binding/gmp/Dockerfile', 'wasm/gmp-wasm/binding/build-gmp.sh') }}
          restore-keys: |
            gmp-${{ runner.os }}-

      - name: Build GMP (wasm)
        run: ./wasm/gmp-wasm/binding/build-gmp.sh

      - name: Build wasm binaries
        run: ./wasm/docker-run.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install web dependencies
        run: pnpm -C wasm/web install

      - name: Run web lint
        run: pnpm -C wasm/web lint

      - name: Run web typecheck
        run: pnpm -C wasm/web typecheck

      - name: Run web unit tests
        run: pnpm -C wasm/web test

      - name: Run web UI regression tests
        run: pnpm -C wasm/web test:ui

      - name: Build web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm -C wasm/web build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: wasm/web/dist
